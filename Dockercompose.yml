services:
  orderbot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-minimax/minimax-m2.5}
      - DATABASE_URL=sqlite:////app/data/orders.db
    volumes:
      - db_data:/app/data

volumes:
  db_data: